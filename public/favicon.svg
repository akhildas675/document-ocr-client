<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#4338ca" stroke-opacity="0.4" />

  <!-- Document Body -->
  <path d="M18 14H38L48 24V50C48 51.1 47.1 52 46 52H18C16.9 52 16 51.1 16 50V16C16 14.9 16.9 14 18 14Z" fill="#2e1065" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Folded corner -->
  <path d="M38 14V24H48" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text lines inside document -->
  <line x1="22" y1="24" x2="32" y2="24" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="32" x2="42" y2="32" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="40" x2="38" y2="40" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" />
  <line x1="22" y1="46" x2="34" y2="46" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" />

  <!-- Scanner beam effect -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0 0 4px #a855f7)" />
</svg>